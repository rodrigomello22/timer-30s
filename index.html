<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#252525" />

  <title>Timer 30s</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #1f1f1f;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .relogio {
      width: 240px;
      background: #252525;
      border-radius: 8px;
      text-align: center;
      padding: 9px 10px 10px;
      color: white;
    }

    .hora {
      font-size: 48px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .timer {
      margin-top: 8px;
      font-size: 11px;
      color: #e5e5e5;
    }

    .segundos {
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>

  <div class="relogio">

    <div id="hora" class="hora">
      00:00:00
    </div>

    <div class="timer">
      Próximo reset em
      <span id="timer" class="segundos">30.0s</span>
    </div>

  </div>

  <script>
    const horaElemento = document.getElementById("hora");
    const timerElemento = document.getElementById("timer");

    function adicionarZero(numero) {
      return String(numero).padStart(2, "0");
    }

    function atualizarRelogio() {
      const agora = new Date();

      const horas = adicionarZero(agora.getHours());
      const minutos = adicionarZero(agora.getMinutes());
      const segundos = adicionarZero(agora.getSeconds());

      horaElemento.textContent =
        `${horas}:${minutos}:${segundos}`;

      const milissegundosNoMinuto =
        agora.getSeconds() * 1000 +
        agora.getMilliseconds();

      const tempoNoCiclo =
        milissegundosNoMinuto % 30000;

      const restante =
        30000 - tempoNoCiclo;

      timerElemento.textContent =
        (restante / 1000).toFixed(1) + "s";

      requestAnimationFrame(atualizarRelogio);
    }

    atualizarRelogio();
  </script>

</body>
</html>
